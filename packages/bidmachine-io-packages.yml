description: >-
  BidMachine ships client SDKs, not server-side API client libraries: the product is an in-app
  bidding / ad-mediation SDK for Android, iOS and Unity (the "BidMachine SDK", 3.x) plus a newer
  unified mediation SDK ("BidMachine Plus", 0.1.x, documented at mediation-docs.bidmachine.io).
  None of them is on Maven Central, PyPI, NuGet, RubyGems, Packagist, crates.io or pkg.go.dev;
  the Android artifacts live on BidMachine's own Artifactory and the Unity packages on GitHub
  (UPM git URL) and BidMachine's own scoped npm registry. There is no first-party client library
  for the Placement Management or Reporting REST APIs. Every version/published pair below was
  read from the registry metadata endpoint named in `registry_url`; the SPM entries have no
  metadata endpoint, so the version is the tag Package.swift pins and the date is the commit date.
