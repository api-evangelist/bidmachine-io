problems:
  - status: 400
    title: Bad Request
    detail: Missing or invalid parameters (e.g. start/end absent or not yyyy-MM-dd, unknown field name).
    remediation: Send start and end as yyyy-MM-dd (end exclusive); keep the window within 45 days (2 years for p2p-revenue); check field names against the fields enum.
    source_operations: [openapi/bidmachine-io-reporting-openapi.yml#retrieveSspReportData, openapi/bidmachine-io-reporting-openapi.yml#retrieveBidderReportData, openapi/bidmachine-io-reporting-openapi.yml#retrieveP2pRevenueReportData]
  - status: 401
    title: Unauthorized
    detail: Invalid or missing Basic credentials (reporting, /auth) or a missing/expired bearer token (placements). Placement tokens are short-lived.
    remediation: Re-authenticate with the dashboard login/password; for placements call POST /auth again and retry with the fresh token.
    source_operations: [openapi/bidmachine-io-placement-management-openapi.yml#getAccessToken, openapi/bidmachine-io-placement-management-openapi.yml#listPlacements, openapi/bidmachine-io-placement-management-openapi.yml#createPlacement, openapi/bidmachine-io-placement-management-openapi.yml#updatePlacement, openapi/bidmachine-io-placement-management-openapi.yml#deletePlacement, openapi/bidmachine-io-reporting-openapi.yml#retrieveSspReportData, openapi/bidmachine-io-reporting-openapi.yml#retrieveBidderReportData, openapi/bidmachine-io-reporting-openapi.yml#retrieveP2pRevenueReportData]
  - status: 403
    title: Forbidden
    detail: The authenticated publisher does not own the requested source (placements), or the account is not entitled to the P2P revenue report.
    remediation: Use a sourceId that belongs to the authenticated publisher; P2P revenue requires account entitlement — contact BidMachine.
    source_operations: [openapi/bidmachine-io-placement-management-openapi.yml#listPlacements, openapi/bidmachine-io-placement-management-openapi.yml#createPlacement, openapi/bidmachine-io-placement-management-openapi.yml#updatePlacement, openapi/bidmachine-io-placement-management-openapi.yml#deletePlacement, openapi/bidmachine-io-reporting-openapi.yml#retrieveP2pRevenueReportData]
  - status: 404
    title: Not Found
    detail: No placement with that id exists on the given source.
    remediation: List placements for the source and use the server-generated id returned on creation.
    source_operations: [openapi/bidmachine-io-placement-management-openapi.yml#updatePlacement]
