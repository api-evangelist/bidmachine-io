description: >-
  Lifecycle signals for BidMachine's API and SDK surface. There is a public Atlassian Statuspage
  (components: Public API, Dashboard, and the US (DFW), US (WAS), EU (AMS), APAC (SIN) regions).
  The REST APIs are versioned in the URI path (/api/v1) and both published contracts are info.version
  1.0.0; the developer portal carries a "v2.0" and "v1.0 (Legacy)" switch for the documentation set
  (the legacy Reporting API page on docs.bidmachine.io still describes the same api-eu.bidmachine.io/api/v1
  endpoint, which answers today). No deprecation policy, no Sunset/Deprecation header support, no SLA
  and no public uptime target are published; SDK deprecations are announced in the SDK changelogs
  only. No Deprecation pointer is emitted because there is no policy page to point at.
