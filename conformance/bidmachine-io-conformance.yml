description: >-
  Standards BidMachine's public surface declares or demonstrably implements. BidMachine is a mobile
  ad exchange, so the domain standards are the IAB Tech Lab family: OpenRTB for the auction surface,
  TCF v2 / US Privacy / GPP for consent signals, MRAID / VAST / OM SDK / SKAdNetwork on the creative
  and measurement side. The REST APIs (Placement Management, Reporting) use plain HTTP Basic and
  Bearer auth with no OAuth 2.0, no OIDC, no RFC 9457 problem details and no cursor pagination.
  No published security certification (SOC 2, ISO 27001, PCI) was found anywhere on the provider's
  surface, so no `Compliance` pointer is emitted.
standards:
  - id: openrtb-2.5
    conforms: true
    scope: BidMachine Auction API (SSP / in-house bidder) and Ad Exchange (DSP side)
    evidence: >-
      "BidMachine bidding supports the OpenRTB 2.5 protocol to receive bid requests from supply partners and
      return bid responses" — https://developers.bidmachine.io/sdk/ssp/overview; bid endpoints
      https://api-{eu,us,apac}.bidmachine.io/auction/prebid/${source_id} (https://developers.bidmachine.io/sdk/general/bidder);
      DSP side "supports the Open RTB version 2.3 and 2.5" (https://developers.bidmachine.io/dsp/requirements) with a
      full bid request / bid response field specification at https://developers.bidmachine.io/dsp/bid-request/specification.
    domain_standard: true
    note: >-
      The OpenRTB contract is published as prose field tables and JSON examples, not as an OpenAPI or JSON Schema, so
      the machine-readable signature the domain_standard_conformance check looks for in a contract is absent; this
      row records the documented conformance honestly without a contract to point at.
