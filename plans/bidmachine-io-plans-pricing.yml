description: >-
  BidMachine publishes no plans or price list. It is a two-sided ad exchange: publishers integrate the
  SDK and are paid for inventory, demand partners buy on a CPM model, and BidMachine's take is not
  published. The only money terms on the public surface are payout terms for publishers. There is no
  /pricing page (404 on www.bidmachine.com), no API pricing, and access to the REST APIs comes with a
  publisher/DSP account rather than a purchased tier.
