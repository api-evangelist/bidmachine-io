apis:
- name: BidMachine OpenRTB Auction API
  description: >-
    OpenRTB 2.5 bid endpoint for in-house bidders and supply partners integrating through the BidMachine
    SDK: one impression per bid request, first-price auction, USD only, regional endpoints in the EU,
    US and APAC keyed by source id. The demand-side (DSP) integration uses the same OpenRTB 2.3/2.5 protocol
    with BidMachine calling the DSP's endpoint. Published as prose field specifications and JSON examples,
    not as a machine-readable contract.
  humanURL: https://developers.bidmachine.io/sdk/general/bidder
  baseURL: https://api-eu.bidmachine.io/auction/prebid/
