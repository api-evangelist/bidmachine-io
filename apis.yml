aid: bidmachine-io
name: BidMachine
description: >-
  BidMachine is a mobile in-app ad exchange and monetization platform (BidMachine, Inc., McLean,
  Virginia; spun out of the Appodeal/Stack group) that sells publishers' mobile inventory to demand
  partners through real-time OpenRTB 2.5 auctions. Publishers integrate the BidMachine SDK (Android,
  iOS, Unity) or the newer unified BidMachine Plus mediation SDK, or plug BidMachine into AppLovin MAX,
  Unity LevelPlay, AdMob/GAM or TopOn as a bidding adapter; DSPs and agencies buy through the exchange.
  Its public APIs are a Placement Management API (create, list, update and delete placements on an ad
  source with a short-lived bearer token) and a Reporting API (SSP, bidder and P2P revenue reports as
  NDJSON or CSV over HTTP Basic), both documented as OpenAPI on developers.bidmachine.io, plus the
  OpenRTB auction endpoints (api-eu / api-us / api-apac) for in-house bidders and supply partners.
